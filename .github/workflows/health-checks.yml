name: Smart Daily Health Checks

on:
  schedule:
    - cron: '0 6,7,8,9,11,12,20,21 * * *' # Covers 08:00, 10:00, 13:00, 22:00 Europe/Brussels across DST
  workflow_dispatch:

jobs:
  check-and-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Download backup and check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CHAT_ID: 8526489078
          DRIVE_FOLDER_ID: 1flE6MFq5be0xCPpPJbyozIVTIZOhzu0X
          DRIVE_FILE_NAME: healthapp-backup.json
        run: |
          node << 'NODEJS_EOF'
          const crypto = require('crypto');
          const { execFileSync } = require('child_process');

          const DRIVE_FOLDER_ID = process.env.DRIVE_FOLDER_ID;
          const DRIVE_FILE_NAME = process.env.DRIVE_FILE_NAME || 'healthapp-backup.json';
          const GOOGLE_SERVICE_ACCOUNT_JSON = process.env.GOOGLE_SERVICE_ACCOUNT_JSON;
          const TELEGRAM_TOKEN = process.env.TELEGRAM_TOKEN;
          const CHAT_ID = process.env.CHAT_ID;

          function base64Url(input) {
            return Buffer.from(input)
              .toString('base64')
              .replace(/=/g, '')
              .replace(/\+/g, '-')
              .replace(/\//g, '_');
          }

          function escapeDriveQueryValue(value) {
            return String(value).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
          }

          async function readResponseText(response, label) {
            const text = await response.text();
            if (!response.ok) {
              throw new Error(`${label} failed: ${response.status} ${text.substring(0, 200)}`);
            }
            return text;
          }

          async function getGoogleAccessToken() {
            if (!GOOGLE_SERVICE_ACCOUNT_JSON) {
              throw new Error('GOOGLE_SERVICE_ACCOUNT_JSON secret is missing');
            }

            let serviceAccount;
            try {
              serviceAccount = JSON.parse(GOOGLE_SERVICE_ACCOUNT_JSON);
            } catch (e) {
              throw new Error('GOOGLE_SERVICE_ACCOUNT_JSON is not valid JSON');
            }

            if (!serviceAccount.client_email || !serviceAccount.private_key) {
              throw new Error('GOOGLE_SERVICE_ACCOUNT_JSON must contain client_email and private_key');
            }

            const tokenUri = serviceAccount.token_uri || 'https://oauth2.googleapis.com/token';
            const now = Math.floor(Date.now() / 1000);
            const header = { alg: 'RS256', typ: 'JWT' };
            const claim = {
              iss: serviceAccount.client_email,
              scope: 'https://www.googleapis.com/auth/drive.readonly',
              aud: tokenUri,
              iat: now,
              exp: now + 3600
            };
            const unsignedJwt = `${base64Url(JSON.stringify(header))}.${base64Url(JSON.stringify(claim))}`;
            const signature = crypto
              .createSign('RSA-SHA256')
              .update(unsignedJwt)
              .sign(serviceAccount.private_key);
            const assertion = `${unsignedJwt}.${base64Url(signature)}`;

            const response = await fetch(tokenUri, {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: new URLSearchParams({
                grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer',
                assertion
              })
            });
            const text = await readResponseText(response, 'Google OAuth token request');
            const tokenData = JSON.parse(text);
            if (!tokenData.access_token) {
              throw new Error('Google OAuth token response did not contain access_token');
            }
            return tokenData.access_token;
          }

          function getBrusselsParts() {
            const parts = new Intl.DateTimeFormat('en-CA', {
              timeZone: 'Europe/Brussels',
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit',
              hour12: false
            }).formatToParts(new Date()).reduce((acc, part) => {
              acc[part.type] = part.value;
              return acc;
            }, {});

            return {
              today: `${parts.year}-${parts.month}-${parts.day}`,
              hour: Number(parts.hour),
              time: `${parts.hour}:${parts.minute}:${parts.second}`
            };
          }

          function parseBackup(fileContent, sourceLabel) {
            if (!fileContent || fileContent.trim().length === 0) {
              throw new Error(`${sourceLabel} is empty`);
            }

            try {
              return JSON.parse(fileContent);
            } catch (parseError) {
              console.error(`JSON Parse Error from ${sourceLabel}:`, parseError.message);
              throw parseError;
            }
          }

          async function listDriveBackupCandidates(accessToken) {
            if (!DRIVE_FOLDER_ID) throw new Error('DRIVE_FOLDER_ID is missing');
            const query = `name = '${escapeDriveQueryValue(DRIVE_FILE_NAME)}' and '${escapeDriveQueryValue(DRIVE_FOLDER_ID)}' in parents and trashed = false`;
            const params = new URLSearchParams({
              q: query,
              spaces: 'drive',
              fields: 'files(id,name,modifiedTime,size,mimeType)',
              orderBy: 'modifiedTime desc',
              pageSize: '10',
              supportsAllDrives: 'true',
              includeItemsFromAllDrives: 'true'
            });
            const searchUrl = `https://www.googleapis.com/drive/v3/files?${params.toString()}`;
            console.log('Drive API search started');
            console.log(`Drive folder ID: ${DRIVE_FOLDER_ID}`);
            console.log(`Drive file name: ${DRIVE_FILE_NAME}`);
            console.log(`Drive query: ${query}`);

            const response = await fetch(searchUrl, {
              headers: { Authorization: `Bearer ${accessToken}` }
            });
            const text = await readResponseText(response, 'Drive files.list');
            const data = JSON.parse(text);
            const candidates = Array.isArray(data.files) ? data.files : [];
            console.log(`Drive API search: found ${candidates.length} candidate file(s)`);
            candidates.forEach((file, index) => {
              console.log(`Candidate ${index + 1}: id=${file.id}; name=${file.name}; modifiedTime=${file.modifiedTime || 'not available'}; size=${file.size || 'unknown'}; mimeType=${file.mimeType || 'unknown'}`);
            });
            return candidates;
          }

          async function downloadDriveFile(accessToken, fileId) {
            const downloadUrl = `https://www.googleapis.com/drive/v3/files/${encodeURIComponent(fileId)}?alt=media&supportsAllDrives=true`;
            const response = await fetch(downloadUrl, {
              headers: { Authorization: `Bearer ${accessToken}` }
            });
            return readResponseText(response, `Drive files.get media ${fileId}`);
          }

          async function loadBackup() {
            const accessToken = await getGoogleAccessToken();
            const candidates = await listDriveBackupCandidates(accessToken);
            if (candidates.length === 0) {
              throw new Error(`No Google Drive backup found for ${DRIVE_FILE_NAME} in folder ${DRIVE_FOLDER_ID}`);
            }

            const loaded = [];
            let lastError = null;
            for (const candidate of candidates) {
              try {
                const content = await downloadDriveFile(accessToken, candidate.id);
                const backup = parseBackup(content, `Drive API file ${candidate.id}`);
                const backupTimestampMs = backup.timestamp ? Date.parse(backup.timestamp) : 0;
                const modifiedTimeMs = candidate.modifiedTime ? Date.parse(candidate.modifiedTime) : 0;
                loaded.push({
                  backup,
                  candidate,
                  backupTimestampMs: Number.isFinite(backupTimestampMs) ? backupTimestampMs : 0,
                  modifiedTimeMs: Number.isFinite(modifiedTimeMs) ? modifiedTimeMs : 0
                });
                console.log(`Backup candidate parsed: id=${candidate.id}; name=${candidate.name}; modifiedTime=${candidate.modifiedTime || 'not available'}; backup.timestamp=${backup.timestamp || 'not available'}; meds=${Array.isArray(backup.meds) ? backup.meds.length : 0}; measureDays=${backup.measures ? Object.keys(backup.measures).length : 0}`);
              } catch (e) {
                lastError = e;
                console.log(`Candidate failed (Drive API; file id: ${candidate.id}; name=${candidate.name}): ${e.message}`);
              }
            }

            if (loaded.length > 0) {
              loaded.sort((a, b) => {
                const byBackupTimestamp = b.backupTimestampMs - a.backupTimestampMs;
                if (byBackupTimestamp !== 0) return byBackupTimestamp;
                return b.modifiedTimeMs - a.modifiedTimeMs;
              });
              const selected = loaded[0];
              console.log(`Selected backup: id=${selected.candidate.id}; name=${selected.candidate.name}; modifiedTime=${selected.candidate.modifiedTime || 'not available'}; backup.timestamp=${selected.backup.timestamp || 'not available'}`);
              return selected.backup;
            }

            throw lastError || new Error('No Google Drive backup candidate found');
          }

          function hasMeasurement(measurement) {
            return !!(measurement && measurement.sys && measurement.dia && measurement.hr);
          }

          function describeMissingMeasurement(measurement) {
            const missing = [];
            if (!measurement || !measurement.sys) missing.push('Systolisch');
            if (!measurement || !measurement.dia) missing.push('Diastolisch');
            if (!measurement || !measurement.hr) missing.push('Hartslag');
            return missing;
          }

          function sendTelegram(text) {
            if (!TELEGRAM_TOKEN || !CHAT_ID) {
              throw new Error('Telegram token or chat id missing');
            }

            execFileSync('curl', [
              '-fsS',
              '-X', 'POST',
              `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`,
              '-d', `chat_id=${CHAT_ID}`,
              '-d', `text=${text}`
            ], { encoding: 'utf8' });
          }

          (async () => {
          try {
            const { today, hour, time } = getBrusselsParts();
            console.log('Workflow started: Smart Daily Health Checks');
            console.log(`Brussels date/time: ${today} ${time}`);

            const backup = await loadBackup();
            const meds = Array.isArray(backup.meds) ? backup.meds : [];
            const intakesToday = backup.intakes?.[today] || {};
            const measuresToday = backup.measures?.[today] || {};

            console.log(`Backup timestamp: ${backup.timestamp || 'not available'}`);
            console.log(`Medication count: ${meds.length}`);
            console.log(`Measurements today: ${Object.keys(measuresToday).filter(key => hasMeasurement(measuresToday[key])).length}`);

            const alerts = [];

            const measurementChecks = {
              8: { key: 'ochtend', label: 'OCHTEND BLOEDWAARDEN MISSEN', log: 'Ochtend bloedwaarden' },
              13: { key: 'middag', label: 'MIDDAG BLOEDWAARDEN MISSEN', log: 'Middag bloedwaarden' },
              22: { key: 'avond', label: 'AVOND BLOEDWAARDEN MISSEN', log: 'Avond bloedwaarden' }
            };

            if (measurementChecks[hour]) {
              const check = measurementChecks[hour];
              const measurement = measuresToday[check.key] || {};
              const missing = describeMissingMeasurement(measurement);
              console.log(`Checking measurement: ${check.log}`);
              if (missing.length > 0) {
                console.log(`Missing measurement fields for ${check.key}: ${missing.join(', ')}`);
                alerts.push(`❌ ${check.label}!%0AOntbreekt: ${missing.join(', ')}`);
              } else {
                console.log(`Measurement ${check.key}: complete`);
              }
            }

            if (hour === 10) {
              console.log('Checking: Medicatie');
              const missingMeds = [];

              for (const med of meds) {
                if (!med || !med.id) {
                  console.log(`Skipping medication without id: ${med && med.name ? med.name : 'unknown'}`);
                  continue;
                }

                const takenAt = intakesToday[med.id];
                if (!takenAt) {
                  missingMeds.push(med.name || med.id);
                } else {
                  console.log(`Medication taken: ${med.name || med.id} at ${takenAt}`);
                }
              }

              if (missingMeds.length > 0) {
                console.log(`Missing medication: ${missingMeds.join(', ')}`);
                alerts.push(`❌ MEDICATIE NIET INGENOMEN!%0AOntbreekt: ${missingMeds.join(', ')}`);
              } else {
                console.log('Medication check: all medication taken or no medication configured');
              }
            }

            if (![8, 10, 13, 22].includes(hour)) {
              console.log(`No check configured for Brussels hour ${hour}`);
            }

            if (alerts.length > 0) {
              console.log(`Telegram alerts to send: ${alerts.length}`);
              for (const alert of alerts) {
                sendTelegram(alert);
                console.log(`Telegram sent: ${alert.substring(0, 60)}...`);
              }
            } else {
              console.log('No Telegram sent: no alerts for this run');
            }
          } catch (e) {
            console.error('Error:', e.message);
            process.exit(1);
          }
          })();
          NODEJS_EOF
