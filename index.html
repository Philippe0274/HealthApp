                                <p style="margin:0 0 4px 0;font-size:16px;font-weight:600;color:#1f2937;">${p.firstName} ${p.lastName}</p>
                                <p style="margin:0;font-size:13px;color:#6b7280;">${t('birthDate')}: ${formatDate(p.birthDate)}</p>
                                <p style="margin:4px 0 0 0;font-size:12px;color:#6b7280;">${t('age')}: ${age} jaar</p>
                                <p style="margin:4px 0 0 0;font-size:12px;color:#6b7280;">${t('language')}: ${getPatientLanguageLabel(p.language || 'nl')}</p>
                            </div>
                        </div>
                        
                        ${p.allergies ? '<div style="margin-bottom:16px;"><p style="margin:0 0 8px 0;font-size:12px;font-weight:600;color:#6b7280;text-transform:uppercase;">🚫 ' + t('allergies') + '</p><p style="margin:0;font-size:14px;color:#1f2937;line-height:1.5;white-space:pre-wrap;">' + p.allergies + '</p></div>' : ''}
                        
                        ${p.medicalHistory ? '<div style="margin-bottom:16px;"><p style="margin:0 0 8px 0;font-size:12px;font-weight:600;color:#6b7280;text-transform:uppercase;">🏥 ' + t('medicalHistory') + '</p><p style="margin:0;font-size:14px;color:#1f2937;line-height:1.5;white-space:pre-wrap;">' + p.medicalHistory + '</p></div>' : ''}
                        
                        ${p.mobilityStatus ? '<div style="margin-bottom:16px;"><p style="margin:0 0 8px 0;font-size:12px;font-weight:600;color:#6b7280;text-transform:uppercase;">🚶 ' + t('mobility') + '</p><p style="margin:0;font-size:14px;color:#1f2937;line-height:1.5;white-space:pre-wrap;"><span style="background:#fef3c7;color:#92400e;padding:4px 12px;border-radius:4px;font-weight:500;display:inline-block;">' + p.mobilityStatus + '</span></p></div>' : ''}

                        <div style="margin-bottom:16px;padding:12px;border:1px solid #e5e7eb;border-radius:8px;background:#f8fafc;">
                            <p style="margin:0 0 8px 0;font-size:12px;font-weight:700;color:#6b7280;text-transform:uppercase;">🏠 Belangrijke datums</p>
                            <p style="margin:0;font-size:13px;color:#1f2937;line-height:1.6;">
                                Verhuis: ${lifeEvents.moveDate ? formatDate(lifeEvents.moveDate) + ' naar ' + (lifeEvents.moveCity || '-') : '-'}<br>
                                Wettelijk samenwonen: ${lifeEvents.legalCohabitationDate ? formatDate(lifeEvents.legalCohabitationDate) : '-'}<br>
                                Huwelijk: ${lifeEvents.marriageDate ? formatDate(lifeEvents.marriageDate) : '-'}
                            </p>
                        </div>

                        <div style="margin-bottom:24px;padding:12px;border:1px solid #e5e7eb;border-radius:8px;background:#f8fafc;">
                            <p style="margin:0 0 8px 0;font-size:12px;font-weight:700;color:#6b7280;text-transform:uppercase;">🚨 ${t('emergencyContact')}</p>
                            ${hasEmergencyContact(emergency) ? `
                                <p style="margin:0 0 4px 0;font-size:14px;color:#1f2937;font-weight:600;">${emergency.fullName}</p>
                                <p style="margin:0;font-size:12px;color:#6b7280;">${emergency.relationship || '-'} • ${getPatientLanguageLabel(emergency.language)}</p>
                                <p style="margin:6px 0 0 0;font-size:12px;color:#1f2937;">${emergency.email || '-'}<br>${emergency.phone || '-'}</p>
                            ` : `<p style="margin:0;font-size:13px;color:#6b7280;">${t('noEmergencyContact')}</p>`}
                        </div>
                        
                        <button onclick="document.getElementById('patient-info-modal').remove()" style="background:#3b82f6;color:white;border:none;width:100%;padding:12px;border-radius:8px;font-weight:500;cursor:pointer;font-size:14px;">${t('close')}</button>
                    </div>
                </div>
            `);
        }
        
        function showPatientEditForm() {
            const p = app.data.patient;
            if (!p) return;
            const patientLanguage = normalizeLangCode(p.language || 'nl');
            const lifeEvents = app.normalizeLifeEvents(p.lifeEvents);
            const patientPhoto = app.getPatientPhotoSrc(p);
            
            document.body.insertAdjacentHTML('beforeend', `
                <div id="patient-modal" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:99999;" onclick="if(event.target.id==='patient-modal') document.getElementById('patient-modal').remove();">
                    <div style="background:white;border-radius:12px;padding:24px;width:95%;max-width:320px;max-height:85vh;overflow-y:auto;">
                        <h2 style="margin:0 0 20px 0;font-size:18px;color:#1f2937;font-weight:600;">✏️ ${t('patientEdit')}</h2>
                        <div style="margin-bottom:16px;">
                            <label style="font-size:12px;color:#6b7280;font-weight:600;display:block;margin-bottom:6px;">${t('firstName')}</label>
                            <input type="text" id="patient-first" value="${p.firstName}" placeholder="Philippe" style="width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:6px;box-sizing:border-box;font-size:14px;">
                        </div>
                        <div style="margin-bottom:16px;">
                            <label style="font-size:12px;color:#6b7280;font-weight:600;display:block;margin-bottom:6px;">${t('lastName')}</label>
                            <input type="text" id="patient-last" value="${p.lastName}" placeholder="De Meersman" style="width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:6px;box-sizing:border-box;font-size:14px;">
                        </div>
                        <div style="margin-bottom:16px;">
                            <label style="font-size:12px;color:#6b7280;font-weight:600;display:block;margin-bottom:6px;">${t('birthDate')}</label>
                            <input type="date" id="patient-birth" value="${p.birthDate}" style="width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:6px;box-sizing:border-box;font-size:14px;">
                        </div>
                        <div style="margin-bottom:16px;">
                            <label style="font-size:12px;color:#6b7280;font-weight:600;display:block;margin-bottom:6px;">🌍 ${t('patientLanguage')}</label>
                            <select id="patient-language" style="width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:6px;box-sizing:border-box;font-size:14px;background:white;">
                                ${buildLanguageOptions(patientLanguage)}
                            </select>
                        </div>
                        <div style="margin-bottom:16px;">
                            <label style="font-size:12px;color:#6b7280;font-weight:600;display:block;margin-bottom:8px;">📷 ${t('photo')}</label>
                            <div id="preview-container" style="display:${patientPhoto ? 'block' : 'none'};margin-bottom:8px;">
                                <img id="photo-preview" src="${patientPhoto || ''}" style="width:100%;height:120px;object-fit:cover;border-radius:6px;margin-bottom:8px;">
                                <div style="display:flex;gap:6px;">
                                    <button type="button" id="change-photo-btn" style="background:#3b82f6;color:white;border:none;padding:6px 12px;border-radius:4px;font-size:11px;cursor:pointer;flex:1;">${t('change')}</button>
                                    <button type="button" id="remove-photo-btn" style="background:#ef4444;color:white;border:none;padding:6px 12px;border-radius:4px;font-size:11px;cursor:pointer;flex:1;">${t('remove')}</button>
                                </div>
                            </div>
                            <div id="upload-area" style="display:${patientPhoto ? 'none' : 'block'};border:2px dashed #d1d5db;border-radius:8px;padding:16px;text-align:center;cursor:pointer;background:#f9fafb;">
                                <div style="font-size:28px;margin-bottom:8px;">📸</div>
                                <p style="font-size:12px;color:#6b7280;margin:0;">Klik om foto te uploaden</p>
                            </div>
                            <input type="file" id="patient-photo" accept="image/*" style="display:none;">
                            <input type="hidden" id="patient-photo-remove-state" value="0">
                        </div>
                        <div style="margin-bottom:16px;">
                            <label style="font-size:12px;color:#6b7280;font-weight:600;display:block;margin-bottom:6px;">🚫 ${t('allergies')}</label>
                            <textarea id="patient-allergies" placeholder="bijv. Penicilline, Noten..." style="width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:6px;box-sizing:border-box;font-size:14px;font-family:inherit;min-height:60px;resize:vertical;">${p.allergies || ''}</textarea>
                        </div>
                        <div style="margin-bottom:16px;">
                            <label style="font-size:12px;color:#6b7280;font-weight:600;display:block;margin-bottom:6px;">🏥 ${t('medicalHistory')}</label>
                            <textarea id="patient-medical-history" placeholder="bijv. Diabetes, Hypertensie, Hartaandoening..." style="width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:6px;box-sizing:border-box;font-size:14px;font-family:inherit;min-height:60px;resize:vertical;">${p.medicalHistory || ''}</textarea>
                        </div>
                        <div style="margin-bottom:16px;">
                            <label style="font-size:12px;color:#6b7280;font-weight:600;display:block;margin-bottom:6px;">🚶 ${t('mobility')}</label>
                            <textarea id="patient-mobility-status" placeholder="bijv. Krukken/Rolstoel, Loopt met hulpmiddel..." style="width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:6px;box-sizing:border-box;font-size:14px;font-family:inherit;min-height:60px;resize:vertical;">${p.mobilityStatus || ''}</textarea>
                        </div>
                        <div style="margin-bottom:16px;padding:12px;border:1px solid #e5e7eb;border-radius:8px;background:#f8fafc;">
                            <h3 style="margin:0 0 10px 0;font-size:14px;font-weight:700;color:#1f2937;">🏠 Belangrijke datums</h3>
                            <label style="font-size:12px;color:#6b7280;font-weight:600;display:block;margin-bottom:6px;">Verhuisdatum</label>
                            <input type="date" id="patient-move-date" value="${lifeEvents.moveDate || ''}" style="width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:6px;box-sizing:border-box;font-size:14px;margin-bottom:10px;">
                            <label style="font-size:12px;color:#6b7280;font-weight:600;display:block;margin-bottom:6px;">Woonplaats</label>
                            <input type="text" id="patient-move-city" value="${lifeEvents.moveCity || ''}" placeholder="Vilvoorde" style="width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:6px;box-sizing:border-box;font-size:14px;margin-bottom:10px;">
                            <label style="font-size:12px;color:#6b7280;font-weight:600;display:block;margin-bottom:6px;">Wettelijk samenwonen</label>
                            <input type="date" id="patient-legal-cohabitation-date" value="${lifeEvents.legalCohabitationDate || ''}" style="width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:6px;box-sizing:border-box;font-size:14px;margin-bottom:10px;">
                            <label style="font-size:12px;color:#6b7280;font-weight:600;display:block;margin-bottom:6px;">Huwelijk</label>
                            <input type="date" id="patient-marriage-date" value="${lifeEvents.marriageDate || ''}" style="width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:6px;box-sizing:border-box;font-size:14px;">
                        </div>
                        ${renderEmergencyContactFields(p.emergencyContact, patientLanguage)}
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px;">
                            <button style="background:#f3f4f6;color:#374151;border:1px solid #e5e7eb;padding:11px 16px;border-radius:6px;font-weight:500;cursor:pointer;font-size:14px;" onclick="document.getElementById('patient-modal').remove();">${t('cancel')}</button>
                            <button style="background:#3b82f6;color:white;border:none;padding:11px 16px;border-radius:6px;font-weight:500;cursor:pointer;font-size:14px;" onclick="savePatientData();">${t('save')}</button>
                        </div>
                    </div>
                </div>
            `);
            
            const fileInput = document.getElementById('patient-photo');
            const uploadArea = document.getElementById('upload-area');
            const previewContainer = document.getElementById('preview-container');
            const photoPreview = document.getElementById('photo-preview');
            const changePhotoBtn = document.getElementById('change-photo-btn');
            const removePhotoBtn = document.getElementById('remove-photo-btn');
            
            // Upload area klikken
            uploadArea.addEventListener('click', () => fileInput.click());
            
            // Change photo button
            changePhotoBtn.addEventListener('click', (e) => {
                e.preventDefault();
                fileInput.click();
            });
            
            // Remove photo button
            removePhotoBtn.addEventListener('click', (e) => {
                e.preventDefault();
                fileInput.value = '';
                photoPreview.src = '';
                previewContainer.style.display = 'none';
                uploadArea.style.display = 'block';
                const removeState = document.getElementById('patient-photo-remove-state');
                if (removeState) removeState.value = '1';
            });
            
            // File change
            fileInput.addEventListener('change', (e) => {
                if (e.target.files[0]) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        photoPreview.src = ev.target.result;
                        previewContainer.style.display = 'block';
                        uploadArea.style.display = 'none';
                        const removeState = document.getElementById('patient-photo-remove-state');
                        if (removeState) removeState.value = '0';
                    };
                    reader.readAsDataURL(e.target.files[0]);
                }
            });
        }
        
        function savePatientData() {
            const firstName = document.getElementById('patient-first').value;
            const lastName = document.getElementById('patient-last').value;
            const birthDate = document.getElementById('patient-birth').value;
            const allergies = document.getElementById('patient-allergies').value;
            const medicalHistory = document.getElementById('patient-medical-history').value;
            const mobilityStatus = document.getElementById('patient-mobility-status').value;
            const language = document.getElementById('patient-language')?.value || 'nl';
            const lifeEvents = {
                moveDate: document.getElementById('patient-move-date')?.value || '',
                moveCity: document.getElementById('patient-move-city')?.value || '',
                legalCohabitationDate: document.getElementById('patient-legal-cohabitation-date')?.value || '',
                marriageDate: document.getElementById('patient-marriage-date')?.value || ''
            };
            const removeEmergency = document.getElementById('emergency-remove')?.checked || false;
            const emergencyContact = removeEmergency ? createEmptyEmergencyContact(language) : normalizeEmergencyContact({
                fullName: document.getElementById('emergency-name')?.value || '',
                relationship: document.getElementById('emergency-relationship')?.value || '',
                email: document.getElementById('emergency-email')?.value || '',
                phone: document.getElementById('emergency-phone')?.value || '',
                language: document.getElementById('emergency-language')?.value || language
            }, language);
            const preview = document.getElementById('photo-preview');
            const removePhoto = document.getElementById('patient-photo-remove-state')?.value === '1';
            
            // Alleen een nieuwe data-foto wordt gecomprimeerd; bestaande foto's blijven via savePatient behouden.
            const hasValidPhoto = !removePhoto && preview && preview.src && preview.src.startsWith('data:');
            const photoBase64 = hasValidPhoto ? preview.src : null;
            
            if (!firstName || !lastName || !birthDate) {
                alert(t('fillRequired'));
                return;
            }
            
            try {
                if (photoBase64) {
                    compressImage(photoBase64, (compressed) => {
                        if (app && app.savePatient) {
                            app.savePatient(firstName, lastName, birthDate, compressed, allergies, medicalHistory, mobilityStatus, language, emergencyContact, lifeEvents, removePhoto);
                            const modal = document.getElementById('patient-modal');
                            if (modal) modal.remove();
                        }
                    });
                } else {
                    if (app && app.savePatient) {
                        app.savePatient(firstName, lastName, birthDate, null, allergies, medicalHistory, mobilityStatus, language, emergencyContact, lifeEvents, removePhoto);
                        const modal = document.getElementById('patient-modal');
                        if (modal) modal.remove();
                    }
                }
            } catch(e) {
                console.error('Error saving patient:', e);
                alert('Fout bij opslaan: ' + e.message);
            }
        }
        
        var app = new App();
        window.app = app;
        app.show();
        
        // Initialize Google Drive
        (async () => {
          try {
            setTimeout(initGoogleDrive, 1500);
          } catch(err) {
            console.error('Google init error:', err);
          }
        })();

        window.addEventListener('focus', () => {
          refreshGoogleDriveConnection('window-focus');
        });

        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) refreshGoogleDriveConnection('visibilitychange');
        });

        function showUpdateNotice() {
            if (document.getElementById('pwa-update-notice')) return;
            const notice = document.createElement('div');
            notice.id = 'pwa-update-notice';
            notice.textContent = 'Nieuwe versie beschikbaar.';
            notice.style.cssText = 'position:fixed;left:12px;right:12px;bottom:14px;z-index:999999;background:#111827;color:white;padding:11px 14px;border-radius:10px;font-size:13px;font-weight:800;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.22);';
            document.body.appendChild(notice);
        }

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            let refreshingForUpdate = false;
            const appScope = new URL('./', window.location.href).pathname;
            const swUrl = new URL('sw.js?v=' + encodeURIComponent(APP_VERSION), window.location.href).href;

            async function checkOnlineAppVersion(registration) {
                try {
                    const response = await fetch(new URL('index.html?version-check=' + Date.now(), window.location.href).href, {
                        cache: 'no-store',
                        headers: { 'Cache-Control': 'no-cache' }
                    });
                    if (!response || !response.ok) return;
                    const html = await response.text();
                    const match = html.match(/const\s+APP_VERSION\s*=\s*['"]([^'"]+)['"]/);
                    const onlineVersion = match && match[1];
                    if (onlineVersion && onlineVersion !== APP_VERSION) {
                        showUpdateNotice();
                        await registration.update().catch(() => {});
                        setTimeout(() => {
                            if (!refreshingForUpdate) window.location.reload();
                        }, 1500);
                    }
                } catch (err) {
                    // Offline or GitHub temporarily unavailable: keep the current PWA working.
                }
            }

            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (refreshingForUpdate) return;
                refreshingForUpdate = true;
                showUpdateNotice();
                setTimeout(() => window.location.reload(), 250);
            });

            navigator.serviceWorker.register(swUrl, {
                scope: appScope,
                updateViaCache: 'none'
            }).then((registration) => {
                registration.update().catch(() => {});
                checkOnlineAppVersion(registration);

                registration.addEventListener('updatefound', () => {
                    const worker = registration.installing;
                    if (!worker) return;
                    worker.addEventListener('statechange', () => {
                        if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                            showUpdateNotice();
                            worker.postMessage({ type: 'SKIP_WAITING' });
                        }
                    });
                });

                setInterval(() => {
                    registration.update().catch(() => {});
                    checkOnlineAppVersion(registration);
                }, 5 * 60 * 1000);

                document.addEventListener('visibilitychange', () => {
                    if (!document.hidden) {
                        registration.update().catch(() => {});
                        checkOnlineAppVersion(registration);
                    }
                });
            }).catch(() => {});
            
            // Listen for periodic sync messages from Service Worker
            navigator.serviceWorker.addEventListener('message', (event) => {
              if (event.data.type === 'PERFORM_SYNC') {
                console.log('Auto-sync triggered:', event.data.tag);
                if (isGTokenValid() && typeof queueDriveAutoSync === 'function') {
                  queueDriveAutoSync('service-worker');
                }
              }
              if (event.data.type === 'NEW_VERSION_READY') {
                showUpdateNotice();
                if (event.data.reload) {
                  setTimeout(() => window.location.reload(), 350);
                }
              }
            });
            
            // Register Periodic Background Sync
            if ('serviceWorker' in navigator && 'BackgroundSyncManager' in window) {
              navigator.serviceWorker.ready.then(registration => {
                // Register sync tags for specific times
                const syncTags = ['sync-07', 'sync-09', 'sync-12', 'sync-21'];
                syncTags.forEach(tag => {
                  registration.periodicSync.register(tag, {
                    minInterval: 24 * 60 * 60 * 1000 // Once per day
                  }).catch(() => {});
                });
              });
            }
        }
    </script>
